<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1ead8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d0a" media="(prefers-color-scheme: dark)">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mapa de Poniente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: a framed, pannable map sheet beside a "ledger" panel; the panel drops below the map on phones. */
:root{
  --paper:#f1ead8; --panel:#f8f3e6; --ink:#2a241c; --ink-2:#6a5f4e; --rule:#d6caae;
  --sea:#dbe2dd; --sea-line:#9cb1b2; --sea-ink:#56707300; --sea-ink:#557074;
  --land:#efe5cb; --river:#5a8b9e; --road:#8b6c43; --wall:#f8fcfd;
  --accent:#9a2a22; --accent-soft:rgba(154,42,34,.12);
  --reg-l:50%; --reg-op:.15; --reg-op-on:.34;
  --snow:#ffffff; --snow-op:.58; --parch:#efe2bf;
  --coast:#2a241c; --sel:#2a241c; --on-sel:#f8f3e6; --vignette:none; --halo:none;
  --f-display:"IM Fell English SC","IM Fell English",Georgia,"Times New Roman",serif;
  --f-map:"IM Fell English",Georgia,"Times New Roman",serif;
  --f-ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f0d0a; --panel:#1a1611; --ink:#ecdfc2; --ink-2:#b1a07f; --rule:#3a3125;
    --sea:#0b1d26; --sea-line:#2d5563; --sea-ink:#86b1b9;
    --land:#2a2219; --river:#5fa6bd; --road:#c9a065; --wall:#d8ecf2;
    --accent:#e3ad55; --accent-soft:rgba(227,173,85,.15);
    --reg-l:58%; --reg-op:.2; --reg-op-on:.36;
    --snow:#d6e6ef; --snow-op:.3; --parch:#3a3123;
    --coast:#cdb385; --sel:#d9a64f; --on-sel:#17130d;
    --vignette:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%);
    --halo:0 0 18px rgba(227,173,85,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f0d0a; --panel:#1a1611; --ink:#ecdfc2; --ink-2:#b1a07f; --rule:#3a3125;
  --sea:#0b1d26; --sea-line:#2d5563; --sea-ink:#86b1b9;
  --land:#2a2219; --river:#5fa6bd; --road:#c9a065; --wall:#d8ecf2;
  --accent:#e3ad55; --accent-soft:rgba(227,173,85,.15);
  --reg-l:58%; --reg-op:.2; --reg-op-on:.36;
  --snow:#d6e6ef; --snow-op:.3; --parch:#3a3123;
  --coast:#cdb385; --sel:#d9a64f; --on-sel:#17130d;
  --vignette:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%);
  --halo:0 0 18px rgba(227,173,85,.12);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:12px}

.bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,36px);line-height:1;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--ink-2);font-family:var(--f-map);font-style:italic;font-size:15px}

.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);font:inherit;font-size:15px}
.search input::placeholder{color:var(--ink-2)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-2);fill:none;stroke-width:1.8}
.results{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--rule);border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto}
.results li{padding:7px 10px;border-radius:2px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.results li[aria-selected="true"],.results li:hover{background:var(--accent-soft)}
.results .r-name{font-family:var(--f-map);font-size:16px}
.results .r-meta{color:var(--ink-2);font-size:13px;white-space:nowrap}
.results .empty{color:var(--ink-2);cursor:default}

.tools{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tools .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;margin:0 2px 0 6px}
.tools .lbl:first-child{margin-left:0}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 11px;border:1px solid var(--rule);border-radius:999px;background:transparent;cursor:pointer;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--panel);color:var(--ink);border-color:var(--ink-2)}
.chip svg{width:12px;height:12px;overflow:visible}
.chip.measure[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.sep{width:1px;height:20px;background:var(--rule);flex:none;margin:0 4px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;min-height:0}
.map{position:relative;min-height:0;overflow:hidden;background:var(--sea);border-radius:2px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.map.dragging{cursor:grabbing}
.map.measuring{cursor:crosshair}
.map::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:var(--vignette)}
.map{box-shadow:var(--halo)}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid var(--ink);box-shadow:inset 0 0 0 4px var(--sea),inset 0 0 0 5px var(--ink-2)}
#svg{display:block;width:100%;height:100%}

.ctl{position:absolute;z-index:5}
.zoom{right:14px;top:14px;display:flex;flex-direction:column;border:1px solid var(--ink-2);border-radius:3px;background:var(--panel);overflow:hidden}
.zoom button{width:36px;height:36px;border:0;background:transparent;cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--rule)}
.zoom button:hover{background:var(--accent-soft)}
.presets{left:14px;top:14px;display:flex;border:1px solid var(--ink-2);border-radius:3px;background:var(--panel);overflow:hidden}
.presets button{border:0;background:transparent;padding:7px 11px;cursor:pointer;font-family:var(--f-display);font-size:15px}
.presets button+button{border-left:1px solid var(--rule)}
.presets button:hover{background:var(--accent-soft)}
.scalebar{left:14px;bottom:14px;padding:6px 10px 5px;background:var(--panel);border:1px solid var(--rule);border-radius:3px;font-size:12px;color:var(--ink-2);pointer-events:none}
.scalebar .bar-line{height:6px;border:1px solid var(--ink);border-top:0;margin-bottom:3px;background:linear-gradient(90deg,var(--ink) 0 50%,transparent 50% 100%) bottom/100% 3px no-repeat}
.scalebar span{font-variant-numeric:tabular-nums}
.scalebar small{display:block;font-size:11px;opacity:.8}
.scalebar small[hidden]{display:none}
.hint{left:50%;bottom:14px;transform:translateX(-50%);padding:6px 12px;background:var(--accent);color:var(--panel);border-radius:999px;font-size:13px;white-space:nowrap;pointer-events:none}

/* SVG map styling */
.sea-bg{fill:var(--sea)}
.sea-hatch line{stroke:var(--sea-line);stroke-width:.7;opacity:.45}
.ripple{fill:none;stroke:var(--sea-line);stroke-linejoin:round}
.land{fill:var(--land)}
.coast{fill:none;stroke:var(--coast);stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lake{fill:var(--sea);stroke:var(--ink);stroke-width:.9px;vector-effect:non-scaling-stroke}
.region{fill:hsl(var(--h) var(--s) var(--reg-l));fill-opacity:var(--reg-op);stroke:none;cursor:pointer;transition:fill-opacity .15s}
.region:hover{fill-opacity:calc(var(--reg-op) + .08)}
.region.on{fill-opacity:var(--reg-op-on)}
.border{fill:none;stroke:var(--ink-2);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-dasharray:5 3 1 3;opacity:.7;pointer-events:none}
.river{fill:none;stroke:var(--river);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.road{fill:none;stroke:var(--road);stroke-width:1.2px;vector-effect:non-scaling-stroke;stroke-dasharray:6 4;pointer-events:none}
.mtn{fill:var(--land);stroke:var(--ink);stroke-width:.8px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.mtn-shade{fill:none;stroke:var(--ink);stroke-width:.6px;vector-effect:non-scaling-stroke;opacity:.7;pointer-events:none}
.tree{fill:var(--land);stroke:var(--ink);stroke-width:.7px;vector-effect:non-scaling-stroke;pointer-events:none}
.tuft{fill:none;stroke:var(--ink-2);stroke-width:.7px;vector-effect:non-scaling-stroke;pointer-events:none}
.sand{fill:var(--ink-2);opacity:.45;pointer-events:none}
.wall-out{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;pointer-events:none}
.wall-in{fill:none;stroke:var(--wall);stroke-width:4.6;stroke-linecap:round;pointer-events:none}
.compass{fill:none;stroke:var(--sea-ink);stroke-width:.9px;vector-effect:non-scaling-stroke}
.compass .solid{fill:var(--sea-ink)}
.compass text{fill:var(--sea-ink);stroke:none;font-family:var(--f-display);font-size:22px}
.decor{pointer-events:none}

.lab text{font-family:var(--f-map);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.lab.reg text{font-family:var(--f-display);fill:var(--ink-2);font-size:14px;letter-spacing:.28em;opacity:.85}
.lab.reg.big text{font-size:17px}
.lab.sea text{font-style:italic;fill:var(--sea-ink);stroke:var(--sea);font-size:14px;letter-spacing:.12em}
.lab.bay text{font-style:italic;fill:var(--sea-ink);stroke:var(--sea);font-size:12px;letter-spacing:.06em}
.lab.feat text{font-style:italic;fill:var(--ink-2);font-size:12.5px;letter-spacing:.04em}
.lab.wall text{font-family:var(--f-display);font-size:12px;letter-spacing:.3em;fill:var(--ink)}
.lab{pointer-events:none}

.loc{cursor:pointer}
.loc .hit{fill:transparent}
.loc .sym{fill:var(--ink);stroke:var(--land);stroke-width:1.6px;paint-order:stroke}
.loc .ring{fill:none;stroke:var(--accent);stroke-width:2px;display:none}
.loc text{font-family:var(--f-map);font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.loc.r1 text{font-family:var(--f-display);font-size:14px}
.loc.r2 text{font-size:13px}
.loc:hover text,.loc:focus-visible text{fill:var(--accent)}
.loc:focus{outline:none}
.loc:focus-visible .ring{display:block;stroke-dasharray:3 2}
.loc.sel .ring{display:block}
.loc.sel text{fill:var(--accent)}
.loc.sel .sym{fill:var(--accent)}

#svg .rk2{display:none} #svg.z2 .rk2{display:inline}
#svg .rk3{display:none} #svg.z3 .rk3{display:inline}
#svg .loc.sel text,#svg .loc.near text{display:inline}
#svg.zfar .lab.reg{opacity:.35}
#svg.hide-city .t-city,#svg.hide-castle .t-castle,#svg.hide-town .t-town,#svg.hide-ruin .t-ruin{display:none}
#svg.no-roads .roads,#svg.no-rivers .rivers,#svg.no-regions .regions,#svg.no-regions .borders{display:none}
#svg .lab.cont{display:none}
#svg.zw .loc text,#svg.zw .lab.reg{display:none}
#svg.zw .loc.w1 text,#svg.zw .lab.cont,#svg.zw .loc.sel text{display:inline}
.lab.cont text{font-family:var(--f-display);font-size:24px;letter-spacing:.45em;fill:var(--ink);opacity:.8}
.route,.route-halo{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.route{stroke:var(--rc);stroke-width:calc(var(--k,1) * 3.4px)}
.route-halo{stroke:var(--land);stroke-width:calc(var(--k,1) * 7px);opacity:.75}
.rstop{pointer-events:none}
.rstop .rring{fill:none;stroke:var(--rc);stroke-width:2.2px}
.rstop .rdot,.rstop .rbadge{fill:var(--rc);stroke:var(--land);stroke-width:1.5px}
.rstop text{fill:#fff;font-family:var(--f-ui);font-weight:700;font-size:10.5px}

.mline{fill:none;stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;stroke-dasharray:7 4}
.mpt circle{fill:var(--accent);stroke:var(--land);stroke-width:2px}
.mpt text{font-family:var(--f-ui);font-weight:700;font-size:12px;fill:var(--accent);paint-order:stroke;stroke:var(--land);stroke-width:3px}

/* Panel */
.panel{min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:18px 18px 22px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.panel h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 8px}
.panel p{margin:10px 0 0;max-width:65ch}
.panel .en{margin-top:4px;color:var(--ink-2);font-family:var(--f-map);font-style:italic}
.panel .lead{font-family:var(--f-map);font-size:17px;line-height:1.4}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.crumb button,.link{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.crumb button:hover,.link:hover{color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:13px;padding:2px 9px;border:1px solid var(--rule);border-radius:999px;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--ink-2);background:transparent;border-radius:3px;padding:7px 12px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--rule)}
.list li:last-child{border-bottom:1px solid var(--rule)}
.list button{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between;border:0;background:none;padding:8px 2px;cursor:pointer;text-align:left}
.list button:hover{background:var(--accent-soft)}
.list .nm{font-family:var(--f-map);font-size:16px;display:flex;align-items:center;gap:9px;min-width:0}
.list .mt{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:2px;flex:none;background:hsl(var(--h) var(--s) var(--reg-l));opacity:.8}
.banner{display:flex;align-items:stretch;gap:12px;margin-top:14px;padding:12px;border:1px solid var(--rule);border-radius:3px}
.banner .colors{display:flex;flex-direction:column;width:16px;flex:none;border-radius:2px;overflow:hidden;border:1px solid var(--rule)}
.banner .colors i{flex:1}
.banner .house{font-weight:700}
.banner .words{font-family:var(--f-map);font-style:italic;font-size:17px;color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:4px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{width:22px;height:14px;flex:none;overflow:visible}
.leg-sym{fill:var(--ink)}
.leg-road{stroke:var(--road);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.leg-river{stroke:var(--river);stroke-width:2;fill:none}
.leg-wall{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.leg-wall2{stroke:var(--wall);stroke-width:3.6;stroke-linecap:round}
.big-num{font-family:var(--f-display);font-size:44px;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}
.big-num small{font-size:18px;color:var(--ink-2);margin-left:6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:14px;font-size:15px}
.facts dt{color:var(--ink-2)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2)}
.ends{display:grid;gap:6px;margin-top:12px}
.ends div{display:flex;gap:10px;align-items:baseline}
.ends b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--panel);font-size:12px;flex:none}
.ends span{font-family:var(--f-map);font-size:16px}
.steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:2px}
.steps button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 4px;cursor:pointer;border-radius:3px}
.steps button:hover{background:var(--accent-soft)}
.steps b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--rc);color:#fff;display:grid;place-items:center;font-size:12px;margin-top:1px}
.st-name{display:block;font-family:var(--f-map);font-size:16px}
.st-t{display:block;font-size:14px;color:var(--ink-2)}
.rsw{width:18px;height:4px;border-radius:2px;flex:none}
.sub-h{margin-top:18px}

.map3d{position:absolute;inset:0;z-index:1;background:var(--paper)}
.map::after{z-index:3}
.map3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.l3{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.l3 .in{display:block;transform:translate(-50%,-50%)}
.l3.lab .in{font-family:var(--f-map);color:var(--ink);text-shadow:0 0 2px var(--land),0 0 3px var(--land),0 0 4px var(--land)}
.l3.reg .in{font-family:var(--f-display);color:var(--ink-2);font-size:14px;letter-spacing:.28em}
.l3.reg.big .in{font-size:17px}
.l3.sea .in,.l3.bay .in{font-style:italic;color:var(--sea-ink);text-shadow:0 0 2px var(--sea),0 0 4px var(--sea)}
.l3.sea .in{font-size:14px;letter-spacing:.12em}
.l3.bay .in{font-size:12px}
.l3.feat .in{font-style:italic;color:var(--ink-2);font-size:12.5px}
.l3.wall .in{font-family:var(--f-display);font-size:12px;letter-spacing:.3em}
.l3.cont .in{font-family:var(--f-display);font-size:24px;letter-spacing:.45em;opacity:.85}
.labels3d .l3.rk2,.labels3d .l3.rk3,.labels3d .l3.cont{display:none}
.labels3d.z2 .l3.rk2,.labels3d.z3 .l3.rk3,.labels3d.zw .l3.cont{display:block}
.labels3d.zw .l3.reg{display:none}
.loc3{pointer-events:auto;cursor:pointer;border:0;background:none;padding:0;width:22px;height:22px;margin:-11px 0 0 -11px;color:var(--ink);font-family:var(--f-map);font-size:12.5px}
.loc3 i{position:absolute;left:11px;top:11px;width:12px;height:12px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 1px var(--land)) drop-shadow(0 0 1px var(--land))}
.loc3 i svg{width:12px;height:12px;overflow:visible;display:block}
.loc3 span{position:absolute;top:11px;left:20px;transform:translateY(-55%);text-shadow:0 0 2px var(--land),0 0 3px var(--land),0 0 4px var(--land)}
.loc3.lp-l span{left:auto;right:20px}
.loc3.lp-t span{left:11px;transform:translate(-50%,-135%)}
.loc3.lp-b span{left:11px;transform:translate(-50%,45%)}
.loc3.r1 span{font-family:var(--f-display);font-size:14px}
.loc3.r2 span{font-size:13px}
.loc3:hover span,.loc3:focus-visible span,.loc3.sel span{color:var(--accent)}
.loc3.sel .leg-sym{fill:var(--accent)}
.loc3:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:50%}
.labels3d .loc3.r2 span,.labels3d .loc3.r3 span{display:none}

/* ---------- Geometry helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const f = n => (Math.round(n*10)/10);
function roughen(pts, amp, step, rand, closed){
  const out=[]; const n=closed?pts.length:pts.length-1;
  for(let i=0;i<n;i++){
    const a=pts[i], b=pts[(i+1)%pts.length]; out.push(a);
    const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len, m=Math.max(1,Math.round(len/step));
    for(let k=1;k<m;k++){const t=k/m, j=(rand()-.5)*2*amp; out.push([a[0]+dx*t+nx*j, a[1]+dy*t+ny*j]);}
  }
  if(!closed) out.push(pts[pts.length-1]);
  return out;
}
function smooth(p, closed){
  const n=p.length, g=i=> closed ? p[(i+n)%n] : p[Math.max(0,Math.min(n-1,i))];
  let d=`M${f(p[0][0])},${f(p[0][1])}`; const end=closed?n:n-1;
  for(let i=0;i<end;i++){
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`;
  }
  return closed? d+"Z" : d;
}
function blob(cx,cy,rx,ry,rot,seed){
  const r=rng(seed), pts=[], n=11, c=Math.cos(rot*Math.PI/180), s=Math.sin(rot*Math.PI/180);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2, k=.78+r()*.34, x=Math.cos(a)*rx*k, y=Math.sin(a)*ry*k; pts.push([cx+x*c-y*s, cy+x*s+y*c]);}
  return smooth(pts,true);
}
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e;};

const landP = new Path2D(coastD), essosP = new Path2D(essosD), lakeP = new Path2D(lakeD);
const onLand = (x,y) => (cx2d.isPointInPath(landP,x,y) || cx2d.isPointInPath(essosP,x,y)) && !cx2d.isPointInPath(lakeP,x,y);
function scatter(cx,cy,rx,ry,n,seed,gap,avoid){
  const r=rng(seed), pts=[]; let tries=0;
  while(pts.length<n && tries<n*40){
    tries++; const a=r()*Math.PI*2, d=Math.sqrt(r()), x=cx+Math.cos(a)*rx*d, y=cy+Math.sin(a)*ry*d;
    if(!onLand(x,y)) continue;
    if(PLACES.some(p=>Math.abs(p.x-x)<(avoid||16) && Math.abs(p.y-y)<(avoid||16))) continue;
    if(pts.some(q=>Math.hypot(q[0]-x,q[1]-y)<gap)) continue;
    pts.push([x,y,r()]);
  }
  return pts.sort((a,b)=>a[1]-b[1]);
}

const MPU = 300/wallLen; // the Wall is 300 miles long

function fitView(){
  const cw=mapEl.clientWidth||1, ch=mapEl.clientHeight||1, a=cw/ch, pad=40;
  let w,h; if(a > (W+pad*2)/(H+pad*2)){h=H+pad*2; w=h*a;} else {w=W+pad*2; h=w/a;}
  return {w,h};
}
function setView(cx,cy,zz){
  zz=Math.max(ZMIN,Math.min(ZMAX,zz));
  const cw=mapEl.clientWidth||1, ch=mapEl.clientHeight||1;
  cx=Math.max(0,Math.min(WX,cx)); cy=Math.max(0,Math.min(HY,cy));
  const w=base.w/zz, h=w*ch/cw;
  view={x:cx-w/2,y:cy-h/2,w,h}; apply();
}
function center(){return [view.x+view.w/2, view.y+view.h/2];}
function apply(){
  const cw=mapEl.clientWidth||1;
  svg.setAttribute("viewBox",`${f(view.x)} ${f(view.y)} ${f(view.w)} ${f(view.h)}`);
  k=view.w/cw; z=base.w/view.w;
  if(Math.abs(k-lastK)>1e-6){ for(const g of scaled) g.setAttribute("transform",`translate(${g._x} ${g._y}) scale(${k.toFixed(4)})`); lastK=k; }

}
function animateTo(cx,cy,zt,dur){
  cancelAnimationFrame(anim);
  if(reduce){setView(cx,cy,zt);return;}

  const step=t=>{const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3), zz=Math.exp(Math.log(sz)+(Math.log(zt)-Math.log(sz))*e);

}

function zoomAt(px,py,factor){

  for(const b in byBook){ const L=byBook[b], [a,e]=SEG[b]; L.forEach((s,k)=>s.time=a+(e-a)*(k+.5)/L.length); }
  for(let i=1;i<all.length;i++) if(all[i].time<all[i-1].time) all[i].time=all[i-1].time+.001;
  r.allStops=all; r.dead=DEAD.has(r.id); r.main=MAIN.has(r.id);
  r.short={dragones:"Dragones",serpientes:"Serpientes",rorge:"Rorge y Mordedor",alleras:"Alleras"}[r.id]||r.name.split(" ").filter(w=>!/^(Gran|Maestre|Archimaestre|Ser|Khal|Septon|Septa)$/.test(w))[0];
});
// Read-up-to level: stages revealed in later books are hidden everywhere.
function applySpoilers(){
  ROUTES.forEach(r=>{
    const vis=r.allStops.filter(s=>s.rev<=state.spoil);
    r.hidden=!vis.length;
    if(r.hidden){ r.pts=[]; r.stops=[]; r.miles=0; r.hiddenCount=r.allStops.length; return; }
    const a=vis[0].pi, b=vis[vis.length-1].pi;
    r.pts=r.allPts.slice(a,b+1).filter(p=>!p.t||vis.includes(p)); r.stops=vis; r.hiddenCount=r.allStops.length-vis.length;
    let L=0; for(let i=1;i<r.pts.length;i++) L+=Math.hypot(r.pts[i].x-r.pts[i-1].x,r.pts[i].y-r.pts[i-1].y); r.miles=L*MPU;
    r.cum=[0]; for(let i=1;i<r.pts.length;i++) r.cum.push(r.cum[i-1]+Math.hypot(r.pts[i].x-r.pts[i-1].x,r.pts[i].y-r.pts[i-1].y));
    r.stops.forEach(s=>s.vi=r.pts.indexOf(s));
  });
}

/* ---------- Optional ambient sound, synthesised with Web Audio (no files) ---------- */
const snd={ctx:null,on:false,layers:{},timer:0,birdT:0,zone:""};
const soundBtn=document.getElementById("soundBtn"), soundLbl=document.getElementById("soundLbl");
function noiseBuf(ctx,sec){ const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate), d=b.getChannelData(0);
  let last=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=w*.5+last*3.5; } return b; }
function lfo(ctx,freq,depth,target,offset){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=freq; g.gain.value=depth; o.connect(g); g.connect(target); o.start(); if(offset!=null) target.value=offset; return o; }
function buildSound(){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
  const ctx=snd.ctx=new AC(), master=ctx.createGain(); master.gain.value=.55; master.connect(ctx.destination); snd.master=master;
  const buf=noiseBuf(ctx,4);
  const src=()=>{ const n=ctx.createBufferSource(); n.buffer=buf; n.loop=true; n.start(0,Math.random()*3); return n; };
  // cold wind: band-passed noise with a wandering centre frequency
  { const n=src(), bp=ctx.createBiquadFilter(), g=ctx.createGain(), out=ctx.createGain(); bp.type="bandpass"; bp.Q.value=1.4;
    lfo(ctx,.07,260,bp.frequency,480); lfo(ctx,.13,.35,g.gain,.6); snd.windBP=bp;
    out.gain.value=0; n.connect(bp); bp.connect(g); g.connect(out); out.connect(master); snd.layers.wind=out; }
  // sea: low-passed noise that swells like waves
  { const n=src(), lp=ctx.createBiquadFilter(), g=ctx.createGain(), out=ctx.createGain(); lp.type="lowpass"; lp.frequency.value=520;
    lfo(ctx,.11,.45,g.gain,.55); lfo(ctx,.11,180,lp.frequency,520);
    out.gain.value=0; n.connect(lp); lp.connect(g); g.connect(out); out.connect(master); snd.layers.sea=out; }
  // soft breeze for the warm south and the inland realms
  { const n=src(), lp=ctx.createBiquadFilter(), hp=ctx.createBiquadFilter(), out=ctx.createGain(); lp.type="lowpass"; lp.frequency.value=1100; hp.type="highpass"; hp.frequency.value=180;
    out.gain.value=0; n.connect(hp); hp.connect(lp); lp.connect(out); out.connect(master); snd.layers.breeze=out; }
  return true;
}
function chirp(){
  const ctx=snd.ctx, t=ctx.currentTime, n=1+Math.floor(Math.random()*3), base=2300+Math.random()*1400;
  for(let i=0;i<n;i++){ const o=ctx.createOscillator(), g=ctx.createGain(), t0=t+i*.16;
    o.type="sine"; o.frequency.setValueAtTime(base,t0); o.frequency.exponentialRampToValueAtTime(base*1.35,t0+.08);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.05,t0+.02); g.gain.exponentialRampToValueAtTime(.0005,t0+.13);
    o.connect(g); g.connect(snd.master); o.start(t0); o.stop(t0+.15); }
}
function soundZone(){
  const [cx,cy]=curCenter(), land=onLand(cx,cy), cold=cy<Math.max(atmo.winter?atmo.Y:0,360)+40;
  if(!land) return cold?"mar helado":"mar";
  if(cold) return "viento del norte";
  return cy>1900&&cx<1000?"brisa de Dorne":cx>1000?"llanuras de Essos":"brisa";
}
const MIX={"viento del norte":{wind:.9,sea:0,breeze:.05},"mar helado":{wind:.45,sea:.7,breeze:0},"mar":{wind:.05,sea:.85,breeze:.05},
  "brisa":{wind:.08,sea:0,breeze:.35},"brisa de Dorne":{wind:.2,sea:0,breeze:.28},"llanuras de Essos":{wind:.3,sea:0,breeze:.3}};
const ZONE_LBL={"viento del norte":"Viento del norte","mar helado":"Mar helado","mar":"Mar","brisa":"Brisa","brisa de Dorne":"Viento del desierto","llanuras de Essos":"Viento de las llanuras"};
function updateSound(){
  if(!snd.on) return;
  const z=soundZone(), m={...MIX[z]}, t=snd.ctx.currentTime; let lbl=ZONE_LBL[z], high=0;
  // in 3D the wind follows the height: stronger and higher-pitched as the camera climbs, and over mountain ranges
  if(view3d.on && view3d.ready){
    const tg=controls.target, mx=tg.x+WX/2, my=tg.z+HY/2, gh=Math.max(0,heightAt(mx,my));
    high=Math.max(0,Math.min(1,(camera.position.y-gh-250)/1600));
    const mtn=onLand(mx,my)&&gh>16 ? Math.min(1,(gh-16)/20) : 0;
    m.wind=Math.min(1.1,m.wind+high*.7+mtn*.6); m.sea*=1-high*.6; m.breeze*=1-high*.7;
    if(high>.55) lbl="Viento de las alturas"; else if(mtn>.3) lbl="Viento de montaña";
    snd.windBP.frequency.setTargetAtTime(480+380*high+150*mtn,t,1.5);
  } else snd.windBP.frequency.setTargetAtTime(480,t,1.5);
  for(const k in snd.layers){ const g=snd.layers[k].gain; g.cancelScheduledValues(t); g.setTargetAtTime(m[k],t,1.2); }
  if(lbl!==snd.zone){ snd.zone=lbl; soundLbl.textContent=lbl; soundBtn.dataset.tip="Sonando: "+lbl.toLowerCase(); }
  if((z==="brisa"||z==="brisa de Dorne") && high<.55 && performance.now()>snd.birdT){ if(snd.birdT) chirp(); snd.birdT=performance.now()+4000+Math.random()*7000; }
}
async function setSound(on){
  if(on && !snd.ctx && !buildSound()){ soundLbl.textContent="Sin sonido"; return; }
  snd.on=on; soundBtn.setAttribute("aria-pressed",on);
  if(on){ await snd.ctx.resume(); snd.zone=""; updateSound(); clearInterval(snd.timer); snd.timer=setInterval(updateSound,400); }
  else { clearInterval(snd.timer); soundLbl.textContent="Sonido"; soundBtn.dataset.tip="Sonido ambiental";
    if(snd.ctx){ const t=snd.ctx.currentTime; for(const k in snd.layers) snd.layers[k].gain.setTargetAtTime(0,t,.3); setTimeout(()=>{ if(!snd.on) snd.ctx.suspend(); },1500); } }
}
soundBtn.onclick=()=>setSound(!snd.on);
document.addEventListener("visibilitychange",()=>{ if(!snd.ctx||!snd.on) return; document.hidden?snd.ctx.suspend():snd.ctx.resume(); });

    const ctx=snd.ctx, b=ctx.createBuffer(1,ctx.sampleRate*.25,ctx.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; csnd.noise=b; }
  return snd.ctx;
}
function hoof(t,vol){
  const ctx=snd.ctx, n=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
  n.buffer=csnd.noise; bp.type="bandpass"; bp.frequency.value=260+Math.random()*120; bp.Q.value=1.8;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0008,t+.09);

function gallop(t){ hoof(t,.55); hoof(t+.085,.4); hoof(t+.17,.5); }
function creak(t){
  const ctx=snd.ctx, o=ctx.createOscillator(), lp=ctx.createBiquadFilter(), g=ctx.createGain(), f0=70+Math.random()*30;
  o.type="sawtooth"; o.frequency.setValueAtTime(f0,t); o.frequency.linearRampToValueAtTime(f0*1.35,t+.5); o.frequency.linearRampToValueAtTime(f0*1.1,t+.9);
  lp.type="lowpass"; lp.frequency.value=420; lp.Q.value=6;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.15); g.gain.linearRampToValueAtTime(.05,t+.6); g.gain.linearRampToValueAtTime(0,t+.95);
  o.connect(lp); lp.connect(g); g.connect(csnd.out); o.start(t); o.stop(t+1);
}
function bell(t){
  const ctx=snd.ctx;
  [[392,.12,2.2],[588,.06,1.6],[784,.035,1.1]].forEach(([f,v,d])=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+d); o.connect(g); g.connect(csnd.out); o.start(t); o.stop(t+d+.05); });
}
function cineSoundTick(){
  if(!cine.on || !csnd.on || !snd.ctx) return;
  const t=snd.ctx.currentTime, st=cineState(cine.clock);
  if(cine.cap!==csnd.cap && cine.cap>=0){ csnd.cap=cine.cap; bell(t+.05); }
  if(!cine.playing || !st.moving) return;
  const P=cinePoint(cine.r,st.d);
  if(onLand(P.x,P.y)){ if(t>=csnd.nextHoof){ gallop(Math.max(t,csnd.nextHoof)); csnd.nextHoof=Math.max(t,csnd.nextHoof)+.52; } }

function cineSoundStart(){
  if(!csnd.on || !cineAudio()) return;
  snd.ctx.resume(); csnd.cap=-1; csnd.nextHoof=0; csnd.nextCreak=0;
  if(!snd.on){ csnd.started=true; setSound(true); }

}
function cineSoundStop(){ clearInterval(csnd.timer); if(csnd.started){ csnd.started=false; setSound(false); } }
{ const _c=startCine; startCine=function(id){ cineSoundStart(); return _c(id); }; }
{ const _s=stopCine; stopCine=function(silent){ const was=cine.on; const r=_s(silent); if(was && !silent) cineSoundStop(); return r; }; }
cineSndBtn.onclick=()=>{
  csnd.on=!csnd.on; try{ localStorage.setItem("poniente-cine-snd",csnd.on?"1":"0"); }catch(_){}

/* ---------- Sound for the timeline: ambience, a horn for each book, bells for near-misses, ravens' wings and a toll for each death ---------- */
const tsnd={on:true,started:false,lastT:null,lastToll:0};
try{ tsnd.on=localStorage.getItem("poniente-tl-snd")!=="0"; }catch(_){}
const tlSndBtn=document.getElementById("tlSnd");
function syncTlBtn(){ tlSndBtn.textContent=tsnd.on?"🔊":"🔇"; tlSndBtn.setAttribute("aria-pressed",tsnd.on); tlSndBtn.setAttribute("aria-label",tsnd.on?"Silenciar la línea de tiempo":"Activar el sonido de la línea de tiempo"); }
syncTlBtn();
function horn(t){
  const ctx=snd.ctx, lp=ctx.createBiquadFilter(), g=ctx.createGain(); lp.type="lowpass"; lp.frequency.setValueAtTime(300,t); lp.frequency.linearRampToValueAtTime(900,t+.7); lp.frequency.linearRampToValueAtTime(400,t+2.4);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.09,t+.5); g.gain.setValueAtTime(.09,t+1.6); g.gain.linearRampToValueAtTime(0,t+2.6);
  [110,110.6,165].forEach(f=>{ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(f*.97,t); o.frequency.linearRampToValueAtTime(f,t+.3); o.connect(lp); o.start(t); o.stop(t+2.7); });
  lp.connect(g); g.connect(csnd.out);
}
function toll(t){
  const ctx=snd.ctx;
  [[98,.16,4.5],[196,.06,3],[262,.04,2.2],[294,.025,1.6]].forEach(([f,v,d])=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0005,t+d); o.connect(g); g.connect(csnd.out); o.start(t); o.stop(t+d+.05); });
}
function wings(t){
  const ctx=snd.ctx;
  for(let i=0;i<5;i++){ const t0=t+i*.17, n=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
    n.buffer=csnd.noise; bp.type="bandpass"; bp.frequency.value=700+Math.random()*300; bp.Q.value=.9;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.18*(1-i*.12),t0+.04); g.gain.exponentialRampToValueAtTime(.001,t0+.14);
    n.connect(bp); bp.connect(g); g.connect(csnd.out); n.start(t0); n.stop(t0+.16); }
  const c=t+.95;
  for(let k=0;k<2;k++){ const t0=c+k*.32, o=ctx.createOscillator(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(560,t0); o.frequency.exponentialRampToValueAtTime(380,t0+.22);
    bp.type="bandpass"; bp.frequency.value=1250; bp.Q.value=3;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.09,t0+.03); g.gain.exponentialRampToValueAtTime(.001,t0+.24);
    o.connect(bp); bp.connect(g); g.connect(csnd.out); o.start(t0); o.stop(t0+.26); }
}
function tlSoundStart(){
  if(!tsnd.on || !cineAudio()) return;
  snd.ctx.resume();
  if(!snd.on){ tsnd.started=true; setSound(true); }
}
function tlSoundStop(){ tsnd.lastT=null; if(tsnd.started){ tsnd.started=false; setSound(false); } }
// sounds for whatever happened between the previous moment and this one (only small forward steps, so a big jump stays quiet)
function tlSoundEvents(a,b){
  if(!tsnd.on || !snd.ctx || !csnd.out || b<=a || b-a>.08) return;
  const t=snd.ctx.currentTime+.03, now=performance.now();
  for(let k=1;k<=5;k++) if(a<k && b>=k){ horn(t); break; }
  for(const e of nearVisible()) if(a<e.time-.07 && b>=e.time-.07) bell(t+.1);
  for(const r of RAVENS){ if(r.book>state.spoil) continue; const t0=r.time-.05; if(a<t0 && b>=t0) wings(t); }
  for(const r of ROUTES){ if(!r.dead || !r.stops || !r.stops.length) continue; const d=r.stops[r.stops.length-1].time+.02;
    if(a<d && b>=d && now-tsnd.lastToll>900){ tsnd.lastToll=now; toll(t+.2); } }
}
{ const _r=renderTL; renderTL=function(){ const r=_r(); if(state.tl){ if(tsnd.lastT!=null) tlSoundEvents(tsnd.lastT,state.t); tsnd.lastT=state.t; } return r; }; }
{ const _p=play; play=function(){ if(!playing) tlSoundStart(); return _p(); }; tlPlay.onclick=play; }
tlRange.addEventListener("pointerdown",tlSoundStart);
{ const _st=setTL; setTL=function(on){ const was=state.tl; const r=_st(on); if(was && !on) tlSoundStop(); return r; }; }
tlSndBtn.onclick=()=>{
  tsnd.on=!tsnd.on; try{ localStorage.setItem("poniente-tl-snd",tsnd.on?"1":"0"); }catch(_){}
  syncTlBtn(); if(tsnd.on) tlSoundStart(); else tlSoundStop();
};

/* ---------- Sound for raven flights: take-off, wingbeats and wind on the way, a caw and the letter on arrival ---------- */
const rsnd={on:true,bus:null};
try{ rsnd.on=localStorage.getItem("poniente-raven-snd")!=="0"; }catch(_){}
function flap(t,vol,dest){
  const ctx=snd.ctx, n=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
  n.buffer=csnd.noise; bp.type="bandpass"; bp.frequency.value=650+Math.random()*350; bp.Q.value=.9;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.04); g.gain.exponentialRampToValueAtTime(.001,t+.15);
  n.connect(bp); bp.connect(g); g.connect(dest); n.start(t); n.stop(t+.17);
}
function caw(t,dest,f0){
  const ctx=snd.ctx;
  for(let k=0;k<2;k++){ const t0=t+k*.3, o=ctx.createOscillator(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f0*.68,t0+.22);
    bp.type="bandpass"; bp.frequency.value=1250; bp.Q.value=3;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.1,t0+.03); g.gain.exponentialRampToValueAtTime(.001,t0+.24);
    o.connect(bp); bp.connect(g); g.connect(dest); o.start(t0); o.stop(t0+.26); }
}
function ravenSoundStop(){ if(!rsnd.bus) return; const b=rsnd.bus, t=snd.ctx.currentTime; rsnd.bus=null;
  b.gain.cancelScheduledValues(t); b.gain.setTargetAtTime(0,t,.08); setTimeout(()=>b.disconnect(),600); }
function ravenSound(delay,dur){
  ravenSoundStop();
  if(!rsnd.on || !cineAudio()) return;
  const ctx=snd.ctx; ctx.resume();
  const bus=rsnd.bus=ctx.createGain(); bus.gain.value=1; bus.connect(csnd.out);
  const t=ctx.currentTime+.05, go=t+Math.max(0,delay-.25), land=t+delay+dur;
  // take-off: a burst of wingbeats and a caw
  for(let i=0;i<5;i++) flap(go+i*.14,.2*(1-i*.1),bus);
  caw(go+.1,bus,600);
  // on the way: wind past the feathers, swelling at the top of the flight, and slower wingbeats
  if(dur>.5){
    const n=ctx.createBufferSource(), lp=ctx.createBiquadFilter(), g=ctx.createGain();
    n.buffer=csnd.noise; n.loop=true; lp.type="lowpass"; lp.frequency.setValueAtTime(500,t); lp.frequency.linearRampToValueAtTime(1100,t+delay+dur/2); lp.frequency.linearRampToValueAtTime(500,land);
    g.gain.setValueAtTime(0,t+delay); g.gain.linearRampToValueAtTime(.12,t+delay+dur/2); g.gain.linearRampToValueAtTime(0,land+.2);
    n.connect(lp); lp.connect(g); g.connect(bus); n.start(t+delay); n.stop(land+.3);
    for(let x=t+delay+.5;x<land-.3;x+=.5+Math.random()*.25){ flap(x,.09,bus); flap(x+.13,.07,bus); }
  }
  // arrival: a flutter, a caw and the letter being unrolled
  for(let i=0;i<4;i++) flap(land+i*.1,.16,bus);
  caw(land+.35,bus,520);
  for(let i=0;i<3;i++){ const t0=land+1.1+i*.12, n=ctx.createBufferSource(), hp=ctx.createBiquadFilter(), g=ctx.createGain();
    n.buffer=csnd.noise; hp.type="highpass"; hp.frequency.value=2500;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.06,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+.1);
    n.connect(hp); hp.connect(g); g.connect(bus); n.start(t0); n.stop(t0+.12); }
}
function ravenSndBtn(){
  const acts=panel.querySelector(".letter ~ .actions"); if(!acts || acts.querySelector(".rsnd")) return;
  const b=document.createElement("button"); b.className="btn rsnd";
  const sync=()=>{ b.textContent=rsnd.on?"🔊 Sonido":"🔇 Sin sonido"; b.setAttribute("aria-pressed",rsnd.on); b.setAttribute("aria-label",rsnd.on?"Silenciar el cuervo":"Activar el sonido del cuervo"); b.title="Sonido del cuervo"; };
  sync(); acts.appendChild(b);
  b.addEventListener("click",e=>{ e.stopPropagation(); rsnd.on=!rsnd.on; try{ localStorage.setItem("poniente-raven-snd",rsnd.on?"1":"0"); }catch(_){} sync(); if(!rsnd.on) ravenSoundStop(); });
}
{ const _fly=flyRaven; flyRaven=function(i){ const res=_fly(i); const in3=view3d.on&&view3d.ready;
    ravenSound(reduce?0:in3?.65:.5, reduce?0:in3?4.2:3.2); ravenSndBtn(); return res; }; }
new MutationObserver(()=>{ if(rsnd.bus && !panel.querySelector(".letter")) ravenSoundStop(); }).observe(panel,{childList:true});

/* ---------- Sound for near misses: two voices that glide towards each other and never meet, over the sound of the place ---------- */
const nsnd={on:true,bus:null};
try{ nsnd.on=localStorage.getItem("poniente-near-snd")!=="0"; }catch(_){}
const NEAR_AMB={"bran-jon":"storm","arya-catelyn":"drums","arya-sam":"canal","victarion-dany":"sea","brienne-sandor":"shovel","tyrion-dany":"dragon"};
function noiseLoop(t,t1,dest,setup){
  const ctx=snd.ctx, n=ctx.createBufferSource(); n.buffer=csnd.noise; n.loop=true; n.playbackRate.value=.5+Math.random()*.1;
  const out=setup(n); out.connect(dest); n.start(t); n.stop(t1);
}
function nearVoices(t,dest){
  const ctx=snd.ctx;
  // one voice per character, from opposite sides, gliding to a semitone apart: close, but never the same note
  [[262,349,-.85,-.18],[523,370,.85,.18]].forEach(([f0,f1,p0,p1],k)=>{
    const o=ctx.createOscillator(), lp=ctx.createBiquadFilter(), g=ctx.createGain(), pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    o.type="triangle"; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+3.2); o.frequency.setValueAtTime(f1,t+4.2); o.frequency.exponentialRampToValueAtTime(k?f1*1.12:f1*.9,t+6);
    lp.type="lowpass"; lp.frequency.value=1400;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.8); g.gain.setValueAtTime(.07,t+4.2); g.gain.linearRampToValueAtTime(0,t+6);
    o.connect(lp); lp.connect(g);
    if(pan){ pan.pan.setValueAtTime(p0,t); pan.pan.linearRampToValueAtTime(p1,t+3.2); pan.pan.setValueAtTime(p1,t+4.2); pan.pan.linearRampToValueAtTime(p0,t+6); g.connect(pan); pan.connect(dest); } else g.connect(dest);
    o.start(t); o.stop(t+6.1);
  });
}
function nearAmb(kind,t,dest){
  const ctx=snd.ctx, end=t+7;
  const swell=(g,v)=>{ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+1.2); g.gain.setValueAtTime(v,end-1.5); g.gain.linearRampToValueAtTime(0,end); };
  if(kind==="storm"||kind==="sea"||kind==="canal"||kind==="wind"||kind==="dragon"||kind==="shovel"||kind==="drums")
    noiseLoop(t,end,dest,n=>{ const f=ctx.createBiquadFilter(), g=ctx.createGain();
      f.type=kind==="wind"||kind==="dragon"?"bandpass":"lowpass"; f.frequency.value=kind==="storm"?900:kind==="sea"?500:kind==="canal"?380:kind==="wind"?520:kind==="dragon"?400:300; f.Q.value=kind==="wind"?1.3:.7;
      if(kind==="sea"||kind==="canal"){ const l=ctx.createOscillator(), lg=ctx.createGain(); l.frequency.value=kind==="sea"?.14:.35; lg.gain.value=.05; l.connect(lg); lg.connect(g.gain); l.start(t); l.stop(end); }
      swell(g,{storm:.16,sea:.14,canal:.08,wind:.12,dragon:.08,shovel:.04,drums:.04}[kind]); n.connect(f); f.connect(g); return g; });
  if(kind==="storm"){ // distant thunder
    [1.6,4.4].forEach((d,i)=>noiseLoop(t+d,t+d+3,dest,n=>{ const f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type="lowpass"; f.frequency.value=160;
      g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(i?.5:.35,t+d+.08); g.gain.exponentialRampToValueAtTime(.001,t+d+2.8); n.connect(f); f.connect(g); return g; })); }
  if(kind==="drums"){ // slow war drums from inside the walls
    for(let x=t+.6;x<end-.8;x+=.9){ [0,.22].forEach((o,i)=>{ const os=ctx.createOscillator(), g=ctx.createGain(), t0=x+o; os.type="sine";
      os.frequency.setValueAtTime(95,t0); os.frequency.exponentialRampToValueAtTime(48,t0+.25); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(i?.18:.28,t0+.01); g.gain.exponentialRampToValueAtTime(.001,t0+.45);
      os.connect(g); g.connect(dest); os.start(t0); os.stop(t0+.5); }); } }
  if(kind==="canal"){ // a bell across the water
    [2,4.8].forEach(d=>[[523,.05,2.4],[784,.025,1.6]].forEach(([f,v,dd])=>{ const o=ctx.createOscillator(), g=ctx.createGain(), t0=t+d; o.frequency.value=f;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.01); g.gain.exponentialRampToValueAtTime(.0005,t0+dd); o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dd+.05); })); }
  if(kind==="shovel"){ // a gravedigger at work
    for(let x=t+.8;x<end-1;x+=1.5+Math.random()*.3) noiseLoop(x,x+.4,dest,n=>{ const f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type="bandpass"; f.frequency.value=1800; f.Q.value=2;
      g.gain.setValueAtTime(0,x); g.gain.linearRampToValueAtTime(.12,x+.05); g.gain.linearRampToValueAtTime(.08,x+.25); g.gain.linearRampToValueAtTime(0,x+.38); n.connect(f); f.connect(g); return g; }); }
  if(kind==="dragon"){ // Drogon flying away, and his wings
    const t0=t+2.2, o=ctx.createOscillator(), lp=ctx.createBiquadFilter(), g=ctx.createGain(); o.type="sawtooth";
    o.frequency.setValueAtTime(120,t0); o.frequency.linearRampToValueAtTime(170,t0+.4); o.frequency.exponentialRampToValueAtTime(60,t0+1.8);
    lp.type="lowpass"; lp.frequency.value=700; lp.Q.value=4; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.12,t0+.2); g.gain.exponentialRampToValueAtTime(.001,t0+2);
    o.connect(lp); lp.connect(g); g.connect(dest); o.start(t0); o.stop(t0+2.1);
    for(let i=0;i<4;i++) noiseLoop(t+3.6+i*.55,t+3.6+i*.55+.4,dest,n=>{ const x=t+3.6+i*.55, f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type="lowpass"; f.frequency.value=260;
      g.gain.setValueAtTime(0,x); g.gain.linearRampToValueAtTime(.4*(1-i*.2),x+.08); g.gain.exponentialRampToValueAtTime(.001,x+.35); n.connect(f); f.connect(g); return g; }); }
  if(kind==="sea") [1.5,4.2].forEach(d=>creak(t+d));
}
function nearSoundStop(){ if(!nsnd.bus) return; const b=nsnd.bus, t=snd.ctx.currentTime; nsnd.bus=null;
  b.gain.cancelScheduledValues(t); b.gain.setTargetAtTime(0,t,.1); setTimeout(()=>b.disconnect(),700); }
function nearSound(e){
  nearSoundStop();
  if(!nsnd.on || !cineAudio()) return;
  const ctx=snd.ctx; ctx.resume();
  const bus=nsnd.bus=ctx.createGain(); bus.connect(csnd.out);
  const t=ctx.currentTime+.1;
  nearAmb(NEAR_AMB[e.a+"-"+e.b]||"wind",t,bus);
  nearVoices(t+.4,bus);
}
function nearSndBtn(){
  const acts=panel.querySelector('.actions [data-act="near-tl"]')?.parentNode; if(!acts || acts.querySelector(".nsnd")) return;
  const b=document.createElement("button"); b.className="btn nsnd";
  const sync=()=>{ b.textContent=nsnd.on?"🔊 Sonido":"🔇 Sin sonido"; b.setAttribute("aria-pressed",nsnd.on); b.setAttribute("aria-label",nsnd.on?"Silenciar el encuentro":"Activar el sonido del encuentro"); b.title="Sonido del encuentro"; };
  sync(); acts.appendChild(b);
  b.addEventListener("click",ev=>{ ev.stopPropagation(); nsnd.on=!nsnd.on; try{ localStorage.setItem("poniente-near-snd",nsnd.on?"1":"0"); }catch(_){} sync();
    if(nsnd.on) nearSound(NEAR[x3.lastNear]); else nearSoundStop(); });
}
{ const _sn=showNear; showNear=function(i){ const r=_sn(i); nearSound(NEAR[i]); nearSndBtn(); return r; }; }
new MutationObserver(()=>{ if(nsnd.bus && !panel.querySelector('[data-act="near-tl"]')) nearSoundStop(); }).observe(panel,{childList:true});

renderIntro();
{ let pref=null; try{pref=localStorage.getItem("poniente-mode");}catch(_){}
  if((pref==="3d" || (pref!=="2d" && !mq.matches)) && webglOK()) setMode(true); }
})();
